<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мой магазин{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'products_list' %}">Мой магазин</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <!-- Каталог товаров: подсветка активного пункта -->
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.view_name == 'products:products_list' or request.resolver_match.url_name == 'products_list' %}active{% endif %}"
                           href="{% url 'products_list' %}">Каталог товаров</a>
                    </li>

                </ul>

                <!-- Панель пользователя справа -->
                <div class="d-flex align-items-center gap-2">
                    {% if user.is_authenticated %}
                        <span class="text-white small">Привет, {{ user.username }}</span>
                        <!-- Сюда позже можно добавить ссылку на профиль -->
                        <a href="#" class="btn btn-sm btn-outline-light">Профиль</a>
                    {% else %}
                        <!-- Заглушки: позже замени на реальные URL login/register -->
                        <a href="#" class="btn btn-sm btn-primary">Войти</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS (обязательно перед закрывающим body) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
