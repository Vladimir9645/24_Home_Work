<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Магазин{% endblock %}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; }
    header { border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
    footer { border-top: 2px solid #333; margin-top: 30px; padding-top: 10px; color: #666; }
    .products-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .product-card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; }
    .product-card img { max-width: 100%; border-radius: 4px; }
    .price { font-weight: bold; font-size: 1.2em; }
    .pagination { margin-top: 20px; display: flex; gap: 15px; align-items: center; }
    .pagination a { text-decoration: none; color: #0066cc; }
    nav ul { display: flex; gap: 20px; list-style: none; }
    nav a { text-decoration: none; color: #333; }
    nav a:hover { color: #0066cc; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <header>
    {% include 'partials/navbar.html' %}
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>&copy; 2026 Наш Магазин</p>
  </footer>
</body>
</html>
