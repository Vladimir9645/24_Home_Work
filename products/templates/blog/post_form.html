<!DOCTYPE html>
<html>
<head><title>{% if object %}Редактировать{% else %}Создать{% endif %} статью</title></head>
<body>
    <h1>{% if object %}Редактирование{% else %}Создание{% endif %} статьи</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить</button>
    </form>
    <br>
    <a href="{% url 'post_list' %}">Отмена</a>
</body>
</html>
